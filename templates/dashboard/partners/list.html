{% extends "dashboard/base_dashboard.html" %}

{% block content %}

<h2 class="fw-bold mb-4">Partenaires</h2>

<a href="{% url 'dashboard:add_partner' %}" class="btn btn-success mb-3">
    ➕ Ajouter un partenaire
</a>

<table class="table table-hover">
    <thead>
        <tr>
            <th>Logo</th>
            <th>Nom</th>
            <th>Actif</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for partner in partners %}
        <tr>
            <td>
                <img src="{{ partner.logo.url }}" width="60">
            </td>
            <td>{{ partner.name }}</td>
            <td>
                {% if partner.is_active %}
                    <span class="badge bg-success">Oui</span>
                {% else %}
                    <span class="badge bg-danger">Non</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'dashboard:edit_partner' partner.id %}" class="btn btn-sm btn-primary">✏️</a>
                <a href="{% url 'dashboard:delete_partner' partner.id %}" class="btn btn-sm btn-danger">🗑️</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>

</table>

{% endblock %}
