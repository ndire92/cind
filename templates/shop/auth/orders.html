<h2>Mes commandes</h2>

{% for order in orders %}
<div class="card p-3 mb-3 shadow-sm">

    <p><strong>Commande #{{ order.id }}</strong></p>
    <p>Date : {{ order.created_at|date:"d/m/Y" }}</p>
    <p>Total : {{ order.total_price }} FCFA</p>

    <p>
        Statut :
        <span class="badge bg-success">
            {{ order.get_order_status_display }}
        </span>
    </p>

    <a href="{% url 'order_detail' order.id %}" class="btn btn-sm btn-primary">
        Suivre la commande
    </a>

</div>
{% empty %}
<p>Aucune commande.</p>
{% endfor %}
